# Local production-like stack: PostgreSQL + one-off migrations/seed + web app + background worker.
#
#   1. docker compose up --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academy}
      POSTGRES_DB: fundamentals_academy
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d fundamentals_academy"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgresql://academy:${POSTGRES_PASSWORD:-academy}@db:5432/fundamentals_academy
      # Seed the catalog and demonstration courses only into an empty database (never overwrites CMS edits).
      SEED_MODE: if-empty
    command: ["sh", "-c", "npx prisma migrate deploy && npm run db:seed"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        APP_URL: ${APP_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://academy:${POSTGRES_PASSWORD:-academy}@db:5432/fundamentals_academy
      APP_URL: ${APP_URL:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - media:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: tools
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://academy:${POSTGRES_PASSWORD:-academy}@db:5432/fundamentals_academy
      APP_URL: ${APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_LOCAL_DIR: /app/storage
    command: ["npm", "run", "worker"]
    volumes:
      - media:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  media:
